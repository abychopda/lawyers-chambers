<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radhika's Chambers</title>
<meta name="description" content="A private research library for case briefs, papers, statutes and notes.">
<meta name="theme-color" content="#8C2F39">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="gate" hidden></div>

<div id="shell">
  <header id="hdr">
    <div class="hdr-top">
      <h1 class="wordmark" id="appname">Radhika's Chambers</h1>
      <span class="hdr-sub" id="hdrsub">corporate law</span>
      <button class="hdr-account" id="acct" data-act="about" aria-label="About this library"></button>
    </div>
    <div class="hdr-search">
      <div class="searchbar">
        <input class="in" id="searchInput" placeholder="Search citations, your notes, the ratio…" autocomplete="off">
      </div>
    </div>
    <div class="filterrow" id="subjectChips"></div>
  </header>

  <main>
    <div id="list"></div>
  </main>

  <button class="fab" data-act="new" aria-label="Add an entry">
    <span class="fab-add">+</span> Add
  </button>
</div>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
